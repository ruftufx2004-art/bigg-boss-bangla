<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>সার্ভারের কাজ চলছে</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #0a0a12;
    color: #f5f5f5;
    font-family: "Noto Sans Bengali", "SolaimanLipi", system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
    /* NOTE: this page is shown inside the site's cropped website frame,
       which is 1600px tall but only its top ~560px are visible — so the
       message sits near the top (padding-top), NOT vertically centred. */
    padding: 170px 20px 40px;
  }
  .dots { font-size: 64px; line-height: 1; letter-spacing: 10px; color: #f5c518; margin-bottom: 8px; }
  .dots span { display: inline-block; animation: pulse 1.4s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  h1 { font-size: 44px; line-height: 1.3; margin: 12px 0 10px; font-weight: 700; }
  p { font-size: 20px; line-height: 1.6; color: #b8b8c8; margin: 0; }
  @media (max-width: 600px) {
    body { padding-top: 130px; }
    h1 { font-size: 32px; }
    p { font-size: 17px; }
    .dots { font-size: 48px; }
  }
</style>
</head>
<body>
  <div class="dots" aria-hidden="true"><span>•</span><span>•</span><span>•</span></div>
  <h1>সার্ভারের কাজ চলছে</h1>
  <p>শীঘ্রই ফিরে আসছি — একটু অপেক্ষা করুন।</p>
</body>
</html>
