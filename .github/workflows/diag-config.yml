name: Diag config save
on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Admin password for /api/config'
        required: true
      frameTop:
        description: 'frameTop value to save'
        required: true
        default: '320'
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      ADMIN_PW: ${{ inputs.password }}
      FRAME_TOP: ${{ inputs.frameTop }}
    steps:
      - name: POST save test and GET config
        run: |
          BODY=$(jq -n --arg pw "$ADMIN_PW" --argjson ft "$FRAME_TOP" '{password:$pw, live:"https://biggboss-bangla.blogspot.com/p/personal.html", s2:"https://www.youtube-nocookie.com/embed/EaYRymDpVJI?autoplay=1&mute=1&controls=0&disablekb=1&fs=0&modestbranding=1&rel=0&iv_load_policy=3", s3:"https://www.youtube-nocookie.com/embed/JOdWmbDoRiM?autoplay=1&mute=1&controls=0&disablekb=1&fs=0&modestbranding=1&rel=0&iv_load_policy=3", frameTop:$ft, frameHeight:560, frameZoom:1, serversOn:{s1:true,s2:true,s3:true}, pollNames:["Monami Ghosh","Durnibar Saha","Niranjan Mondal (Laughtersane)","Tanushree Roy Das","Srijla Guha","Rajveer Dey","Jeetu Kamal","Sourav Das","Ranieeta Dash"]}')
          echo "--- POST /api/config frameTop=$FRAME_TOP ---"
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST "https://bigg-boss-bangla.pages.dev/api/config" -H "Content-Type: application/json" --data "$BODY"
          echo "--- GET /api/config ---"
          curl -s "https://bigg-boss-bangla.pages.dev/api/config"
          echo ""
