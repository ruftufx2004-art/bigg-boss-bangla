name: Extract site zip (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify zip contents before extracting
        run: |
          set -euo pipefail
          test -f bigg-boss-site.zip
          unzip -l bigg-boss-site.zip
          unzip -p bigg-boss-site.zip index.html | grep -F -q '/(live|shorts)/'
          unzip -p bigg-boss-site.zip index.html | grep -F -q 'youtube-nocookie.com/embed'
          unzip -p bigg-boss-site.zip admin.html | grep -F -q '/(live|shorts)/'
          echo 'Verified: YouTube live/shorts/watch embed conversion present in index.html and admin.html'

      - name: Extract zip and remove one-time files
        run: |
          set -euo pipefail
          unzip -o bigg-boss-site.zip
          rm -f bigg-boss-site.zip
          rm -f .github/workflows/extract-site.yml
          git status --short

      - name: Commit extracted site
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && echo 'No changes to commit' && exit 0
          git commit -m "Fix: YouTube live/shorts/watch links now convert to embed URLs in admin panel and homepage"
          git push
