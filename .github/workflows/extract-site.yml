name: One-time site extract
on:
  push:
    paths:
      - 'bigg-boss-site.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify zip and extract
        run: |
          python3 - <<'PY'
          import zipfile, os, shutil
          z = zipfile.ZipFile('bigg-boss-site.zip')
          print(z.namelist())
          idx = [n for n in z.namelist() if n.rsplit('/', 1)[-1] == 'index.html']
          assert idx, 'no index.html in zip'
          data = z.read(idx[0]).decode('utf-8', errors='ignore')
          assert 'liveBoundVid' in data, 'liveBoundVid NOT found in index.html'
          print('verified liveBoundVid in', idx[0])
          z.extractall('.tmp-extract')
          entries = os.listdir('.tmp-extract')
          base = '.tmp-extract'
          if len(entries) == 1 and os.path.isdir(os.path.join(base, entries[0])):
              base = os.path.join(base, entries[0])
          for root, dirs, files in os.walk(base):
              for f in files:
                  src = os.path.join(root, f)
                  rel = os.path.relpath(src, base)
                  os.makedirs(os.path.dirname(rel) or '.', exist_ok=True)
                  shutil.copyfile(src, rel)
                  print('wrote', rel)
          shutil.rmtree('.tmp-extract')
          PY
          rm -f bigg-boss-site.zip
          rm -f .github/workflows/extract-site.yml
          rmdir .github/workflows .github 2>/dev/null || true
      - name: Commit extracted site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then echo "no changes to commit"; exit 0; fi
          git commit -m "Live player: stop re-binding same video"
          git push
