name: Extract site zip
on:
  push:
    paths:
      - bigg-boss-site.zip
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify zip contains the label-sync fix
        run: |
          test -f bigg-boss-site.zip
          python3 - << 'PY'
          import zipfile, sys
          z = zipfile.ZipFile('bigg-boss-site.zip')
          names = z.namelist()
          print(names)
          data = None
          for n in names:
              if n == 'index.html' or n.endswith('/index.html'):
                  data = z.read(n)
                  break
          assert data is not None, 'index.html not found in zip'
          assert b'liveSyncTimer' in data, 'index.html does not contain liveSyncTimer'
          print('Verified: index.html contains liveSyncTimer')
          PY
      - name: Extract site and clean up
        run: |
          unzip -o bigg-boss-site.zip
          rm -f bigg-boss-site.zip
          rm -f .github/workflows/extract-site.yml
          ls -la
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Live player: poll state so Play/Pause label stays in sync" || echo "Nothing to commit"
          git push
