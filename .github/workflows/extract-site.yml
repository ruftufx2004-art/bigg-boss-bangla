name: Extract site zip (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract site zip into repo
        run: |
          set -e
          unzip -o bigg-boss-site.zip -d /tmp/site-extract
          if [ -f "/tmp/site-extract/index.html" ]; then
            cp -r /tmp/site-extract/. .
          else
            for d in /tmp/site-extract/*/; do
              if [ -f "$d/index.html" ]; then cp -r "$d". .; fi
            done
          fi
          rm -rf /tmp/site-extract
          rm -f bigg-boss-site.zip
          rm -rf .github/workflows/extract-site.yml
          git config user.name "ruftufx2004-art"
          git config user.email "ruftufx2004@gmail.com"
          git add -A
          git status --short
          git commit -m "Poll: ranked fluid results + LIVE NOW player fixed" || echo "nothing to commit"
          git push
