name: Extract site zip (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify zip contents before extracting
        run: |
          set -euo pipefail
          test -f bigg-boss-site.zip
          unzip -l bigg-boss-site.zip
          echo '--- index.html: YouTube-related lines ---'
          unzip -p bigg-boss-site.zip index.html | grep -n -i -E 'live|shorts|nocookie|youtube' | head -60 || true
          echo '--- admin.html: YouTube-related lines ---'
          unzip -p bigg-boss-site.zip admin.html | grep -n -i -E 'live|shorts|nocookie|youtube' | head -60 || true
          echo '--- Required string checks ---'
          unzip -p bigg-boss-site.zip index.html | grep -F -q 'youtube-nocookie.com/embed'
          echo 'index.html contains youtube-nocookie.com/embed'
          if unzip -p bigg-boss-site.zip index.html | grep -F -q '/(live|shorts)/'; then echo 'index.html contains /(live|shorts)/'; else echo 'NOTE: index.html does NOT contain the literal /(live|shorts)/'; fi
          if unzip -p bigg-boss-site.zip admin.html | grep -F -q '/(live|shorts)/'; then echo 'admin.html contains /(live|shorts)/'; else echo 'NOTE: admin.html does NOT contain the literal /(live|shorts)/'; fi

      - name: Extract zip and remove one-time files
        run: |
          set -euo pipefail
          unzip -o bigg-boss-site.zip
          rm -f bigg-boss-site.zip
          rm -f .github/workflows/extract-site.yml
          git status --short

      - name: Commit extracted site
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && echo 'No changes to commit' && exit 0
          git commit -m "Fix: YouTube live/shorts/watch links now convert to embed URLs in admin panel and homepage"
          git push
