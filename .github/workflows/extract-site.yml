name: Extract site zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site
        run: |
          unzip -o bigg-boss-site-6c.zip
          rm bigg-boss-site-6c.zip
          test -f functions/api/config.js
          grep -q "live_config" functions/api/config.js
          grep -q "SUPABASE" functions/api/config.js
          grep -q "Deploy marker 2026-11-18 20:30" functions/api/config.js
          grep -q "kvPending" admin.html
      - name: Commit extracted site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy marker (site-6c)"
          git push
